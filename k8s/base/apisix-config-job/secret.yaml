apiVersion: v1
kind: Secret
metadata:
  name: apisix-secrets
  namespace: gateway
type: Opaque
stringData:
  # Admin key must match config.yaml → deployment.admin.admin_key[0].key
  admin-key: "supersecretadminkey"
  # The API key that internal callers must present in X-API-KEY header
  internal-api-key: "internal-secret-key-CHANGE-IN-PRODUCTION"
