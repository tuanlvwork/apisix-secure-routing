apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-config-job
  namespace: gateway
  labels:
    app: apisix-config-job
spec:
  # Retry up to 10 times if APISIX isn't ready yet
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: apisix-config-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apisix-configurator
          image: curlimages/curl:8.6.0
          command: ["sh", "/scripts/configure-apisix.sh"]
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-secrets
                  key: admin-key
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-secrets
                  key: internal-api-key
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: scripts
          configMap:
            name: apisix-config-scripts
            defaultMode: 0755
