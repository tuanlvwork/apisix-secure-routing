apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config-scripts
  namespace: gateway
data:
  configure-apisix.sh: |
    #!/bin/sh
    set -eu

    ADMIN_URL="http://apisix-admin.gateway.svc.cluster.local:9180"
    ADMIN_KEY="${APISIX_ADMIN_KEY}"
    INTERNAL_KEY="${INTERNAL_API_KEY}"

    # ─── helpers ──────────────────────────────────────────────────────────────
    apisix_put() {
      RESOURCE="$1"; BODY="$2"
      HTTP_CODE=$(curl -s -o /tmp/apisix_resp -w "%{http_code}" \
        -X PUT "${ADMIN_URL}/apisix/admin/${RESOURCE}" \
        -H "X-API-KEY: ${ADMIN_KEY}" \
        -H "Content-Type: application/json" \
        -d "${BODY}")
      echo "  → ${RESOURCE} — HTTP ${HTTP_CODE}"
      cat /tmp/apisix_resp; echo ""
      # Fail loudly on non-2xx so the job shows as Failed (not silently stuck)
      case "${HTTP_CODE}" in
        2*) ;;
        *) echo "ERROR: unexpected HTTP ${HTTP_CODE} for ${RESOURCE}" >&2; exit 1 ;;
      esac
    }

    # ─── wait for APISIX admin API ────────────────────────────────────────────
    echo ">>> Waiting for APISIX Admin API at ${ADMIN_URL} ..."
    until curl -sf -o /dev/null \
        -H "X-API-KEY: ${ADMIN_KEY}" \
        "${ADMIN_URL}/apisix/admin/routes"; do
      echo "    not ready, retrying in 3s..."
      sleep 3
    done
    echo ">>> APISIX Admin API is ready!"
    echo ""

    # ═════════════════════════════════════════════════════════════════════════
    # 1. UPSTREAM — product-service
    #    FQDN resolves across namespaces inside the cluster
    # ═════════════════════════════════════════════════════════════════════════
    echo ">>> [1/4] Creating upstream: product-service"
    apisix_put "upstreams/product-service" '{
      "id": "product-service",
      "name": "product-service",
      "desc": "NestJS product microservice in services namespace",
      "type": "roundrobin",
      "scheme": "http",
      "nodes": {
        "product-service.services:80": 1
      },
      "keepalive_pool": { "size": 320, "idle_timeout": 60, "requests": 1000 },
      "checks": {
        "active": {
          "type": "http",
          "http_path": "/api/health",
          "interval": 10,
          "timeout": 1,
          "healthy": { "http_statuses": [200], "successes": 2 },
          "unhealthy": { "http_statuses": [429, 500, 503], "http_failures": 2 }
        }
      }
    }'

    # ═════════════════════════════════════════════════════════════════════════
    # 2. CONSUMER — internal-client (holds the API key for internal routes)
    # ═════════════════════════════════════════════════════════════════════════
    echo ">>> [2/4] Creating consumer: internal_client"
    apisix_put "consumers/internal_client" "{
      \"username\": \"internal_client\",
      \"desc\": \"Service-to-service caller on the internal network\",
      \"plugins\": {
        \"key-auth\": { \"key\": \"${INTERNAL_KEY}\" }
      }
    }"

    # ═════════════════════════════════════════════════════════════════════════
    # 3. EXTERNAL ROUTE — port 9080, NO auth
    #
    #  SECURITY MODEL: namespace isolation via proxy-rewrite
    #
    #  /external/*  →  proxy-rewrite  →  /api/public/*
    #
    #  Wildcard is SAFE because port 9080 can only ever reach the
    #  /api/public/* namespace in NestJS. No path on this port can
    #  reach /api/internal/* — the namespaces are disjoint.
    #
    #  Even if attacker tries:
    #    GET :9080/external/internal/products  → /api/public/internal/products  → 404
    #
    #  Adding a new public endpoint? Just add @Controller('public/orders') in NestJS.
    #  No APISIX change needed — the wildcard already covers it.
    # ═════════════════════════════════════════════════════════════════════════
    echo ">>> [3/4] Creating route: product-service EXTERNAL (port 9080)"
    apisix_put "routes/product-external" '{
      "id": "product-external",
      "name": "product-service-external",
      "desc": "Public endpoints — port 9080, wildcard safe via namespace isolation",
      "uri": "/external/*",
      "methods": ["GET", "OPTIONS"],
      "vars": [["server_port", "==", "9080"]],
      "plugins": {
        "proxy-rewrite": {
          "regex_uri": ["/external/(.*)", "/api/public/$1"]
        }
      },
      "upstream_id": "product-service"
    }'

    # ═════════════════════════════════════════════════════════════════════════
    # 4. INTERNAL ROUTE — port 9081, key-auth required
    #
    #  SECURITY MODEL: namespace isolation + key-auth + 401→44 stealth
    #
    #  /internal/*  →  proxy-rewrite  →  /api/internal/*
    #
    #  Wildcard is safe: port 9081 can only reach /api/internal/* namespace.
    #  key-auth rejects missing/bad keys with 401, which is then rewritten
    #  to 404 so the route existence is completely hidden.
    #
    #  Adding a new internal service? Just add @Controller('internal/orders')
    #  in NestJS. No APISIX change needed.
    # ═════════════════════════════════════════════════════════════════════════
    echo ">>> [4/4] Creating route: product-service INTERNAL (port 9081)"
    apisix_put "routes/product-internal" '{
      "id": "product-internal",
      "name": "product-service-internal",
      "desc": "Internal endpoints — port 9081, key-auth, wildcard safe via namespace isolation",
      "uri": "/internal/*",
      "methods": ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
      "vars": [["server_port", "==", "9081"]],
      "plugins": {
        "key-auth": {
          "header": "X-API-KEY"
        },
        "proxy-rewrite": {
          "regex_uri": ["/internal/(.*)", "/api/internal/$1"]
        },
        "serverless-post-function": {
          "phase": "header_filter",
          "functions": [
            "return function(conf, ctx)\n  if ngx.status == 401 then\n    ngx.status = 404\n    ngx.header[\"content-type\"] = \"application/json; charset=utf-8\"\n  end\nend"
          ]
        }
      },
      "upstream_id": "product-service"
    }'

    echo ""
    echo "✓ APISIX configuration complete!"
    echo ""
    echo "  External (public, no auth):"
    echo "    curl http://<NODE_IP>:30080/external/products"
    echo ""
    echo "  Internal (API key required):"
    echo "    curl -H 'X-API-KEY: ${INTERNAL_KEY}' http://<NODE_IP>:30081/internal/products"
    echo "    curl -H 'X-API-KEY: ${INTERNAL_KEY}' http://<NODE_IP>:30081/internal/products/stats"
    echo ""
    echo "  Security test — hacker guesses /admin on public port (must return 404):"
    echo "    curl -v http://<NODE_IP>:30080/external/products/stats"
    echo "    curl -v http://<NODE_IP>:30080/external/internal/products"
    echo ""
    echo "  Security test — no key on internal port (must return 404, NOT 401):"
    echo "    curl -v http://<NODE_IP>:30081/internal/products"
