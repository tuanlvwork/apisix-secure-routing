apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-apisix-dashboard
  namespace: gateway
data:
  apisix.json: |
    {
      "title": "Apache APISIX",
      "panels": [
        {
          "type": "timeseries",
          "title": "Total Requests",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(apisix_http_status[1m]))",
              "legendFormat": "Total Requests"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP 429 (Rate Limited)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(apisix_http_status{code=\"429\"}[1m]))",
              "legendFormat": "429 Responses"
            }
          ]
        }
      ]
    }
