apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: gateway
data:
  config.yaml: |
    apisix:
      # Listen on two ports:
      #   9080 → External / Public  (simulates GKE External LB)
      #   9081 → Internal / Private (simulates GKE Internal LB)
      node_listen:
        - port: 9080
        - port: 9081
      # enable_http2 moved to apisix level in APISIX >= 3.9
      # (per-port enable_http2 is deprecated and causes fatal ERROR on startup)
      enable_http2: false
      enable_ipv6: false
      enable_admin: true         # Expose Admin API on the admin_listen port (9180)
      enable_admin_cors: true    # Allow browser/curl from any origin to reach admin


    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        allow_admin:
          - 0.0.0.0/0   # Tighten to pod CIDR in production
        admin_listen:
          ip: 0.0.0.0
          port: 9180
        admin_key_required: true
        admin_key:
          - name: admin
            key: supersecretadminkey   # Overridden by Secret env mount in prod
            role: admin
      etcd:
        host:
          - http://etcd.gateway.svc.cluster.local:2379
        prefix: /apisix
        timeout: 30

    # Enable only plugins we actually use
    plugins:
      - proxy-rewrite
      - key-auth
      - serverless-post-function
      - response-rewrite
      - cors
      - limit-count
      - ip-restriction
      - request-id
      - prometheus
