apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: gateway
data:
  config.yaml: |
    apisix:
      # Data plane: serve traffic only — Admin API lives in apisix-admin pod
      node_listen:
        - port: 9080   # External / Public  (maps to GKE External LB)
        - port: 9081   # Internal / Private (maps to GKE Internal LB)
      enable_http2: false
      enable_ipv6: false
      enable_admin: false   # Admin API disabled — handled by apisix-admin pod

    deployment:
      role: data_plane
      role_data_plane:
        config_provider: etcd
      etcd:
        host:
          - http://etcd.gateway.svc.cluster.local:2379
        prefix: /apisix
        timeout: 30

    # Enable only plugins we actually use
    plugins:
      - proxy-rewrite
      - key-auth
      - serverless-post-function
      - response-rewrite
      - cors
      - limit-count
      - ip-restriction
      - request-id
      - prometheus
