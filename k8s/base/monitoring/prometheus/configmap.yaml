apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gateway
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'apisix'
        static_configs:
          - targets: ['apisix.gateway.svc.cluster.local:9091']
        metrics_path: '/apisix/prometheus/metrics'
