apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: gateway
spec:
  type: NodePort
  ports:
    - name: http-ext
      port: 9080
      targetPort: 9080
      nodePort: 30080   # External (public) — curl http://$(minikube ip):30080/...
    - name: http-int
      port: 9081
      targetPort: 9081
      nodePort: 30081   # Internal — simulates private LB
